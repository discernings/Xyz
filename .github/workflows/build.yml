name: Build Lumim APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Add login redirect (deep link)
        run: |
          sed -i 's#</activity>#<intent-filter><action android:name="android.intent.action.VIEW"/><category android:name="android.intent.category.DEFAULT"/><category android:name="android.intent.category.BROWSABLE"/><data android:scheme="com.v.lumim"/></intent-filter></activity>#' android/app/src/main/AndroidManifest.xml

      - name: Generate app icons
        run: npx @capacitor/assets generate --android --assetPath resources

      - name: Crisp splash screen (Android 12+)
        run: |
          mkdir -p android/app/src/main/res/drawable-nodpi
          cp resources/icon-foreground.png android/app/src/main/res/drawable-nodpi/splash_leaf.png
          sed -i 's#\(<style name="AppTheme.NoActionBarLaunch"[^>]*>\)#\1<item name="windowSplashScreenBackground">\#ffffff</item><item name="windowSplashScreenAnimatedIcon">@drawable/splash_leaf</item>#' android/app/src/main/res/values/styles.xml

      - name: Allow foreground service (background music)
        run: sed -i 's/targetSdkVersion = 34/targetSdkVersion = 33/' android/variables.gradle

      - name: Sync
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Lumim-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
